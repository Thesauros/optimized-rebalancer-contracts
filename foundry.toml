[profile.default]
solc_version = '0.8.33'
optimizer = true
optimizer_runs = 200
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
cache_path = 'cache_forge'

ignored_warnings_from = ["lib/", "node_modules/"] # ignore warnings from dependencies

[lint]
exclude_lints = [
    "mixed-case-function",
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "unaliased-plain-import",
    "asm-keccak256",
]
lint_on_build = false

[rpc_endpoints]
base = "${BASE_RPC_URL}"
